[project]
name = "django-urlconfchecks"
version = "0.14.0"
description = "a python package for type checking the urls and associated views."
authors = [{ name = "ali sayyah", email = "ali.sayyah2@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
]
dependencies = [
    "Django>=5.2.8",
    "typer>=0.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.2.0,<10",
    "ruff>=0.17.3,<0.18",
    "pytest-cov>=7.1.0,<8",
    "pytest-django>=4.14.0,<5",
    "pyupgrade>=3.22.0,<4",
    "coverage[toml]>=7.17.0,<8",
    "ty>=0.0.94,<0.1",
    "djangorestframework>=3.18.3,<4",
    "django-ninja>=1.7.1,<2",
]
dev = [
    "tox>=4.67.4,<5",
    "tox-uv>=1.37.2,<2",
    "pre-commit>=4.7.0,<5",
    "virtualenv>=21.15.1,<22",
    "twine>=7.0.0,<8",
    "toml~=0.10.2",
    "bump2version~=1.0.1",
]
doc = [
    "zensical>=0.0.73,<0.1",
]

[project.urls]
Homepage = "https://github.com/AliSayyah/django-urlconfchecks"

[project.scripts]
urlconfchecks = "django_urlconfchecks.cli:app"

[tool.hatch.build.targets.sdist]
include = [
    "django_urlconfchecks",
    "tests",
]

[tool.hatch.build.targets.wheel]
include = ["django_urlconfchecks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    ".uv-cache",
    ".uv-tools",
    ".ruff_cache",
    ".pytest_cache",
    "build",
    "dist",
    "site",
    "docs/_build",
    "docs/site",
]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "D", "W", "C90"]
ignore = ["E203", "E266", "D107", "C901"]
per-file-ignores = { "__init__.py" = ["F401"], "tests/*" = ["D101", "D102", "D103"] }

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "tests.dummy_project.settings"

[tool.coverage.run]
# omit = []

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "def main",
]

[tool.tox]
requires = ["tox>=4", "tox-uv>=1.1"]
env_list = [
    "py311-django52",
    "py312-django52",
    "py313-django52",
    "py314-django52",
    "py315-django52",
    "py312-django60",
    "py313-django60",
    "py314-django60",
    "py315-django60",
    "py312-django61",
    "py313-django61",
    "py314-django61",
    "py315-django61",
    "format",
    "lint",
    "build",
]

[tool.tox.env_run_base]
description = "Run tests under {base_python}"
runner = "uv-venv-runner"
uv_python_preference = "managed"
allowlist_externals = ["pytest"]
extras = ["test"]
pass_env = ["*"]
set_env = { PYTHONPATH = "{tox_root}", PYTHONWARNINGS = "ignore" }
commands = [
    [
        "pytest",
        "--cov=django_urlconfchecks",
        "--cov-branch",
        "--cov-report=xml",
        "--cov-report=term-missing",
        "tests",
    ],
]

[tool.tox.env.py311-django52]
deps = ["Django>=5.2.8,<5.3"]

[tool.tox.env.py312-django52]
deps = ["Django>=5.2.8,<5.3"]

[tool.tox.env.py313-django52]
deps = ["Django>=5.2.8,<5.3"]

[tool.tox.env.py314-django52]
deps = ["Django>=5.2.8,<5.3"]

[tool.tox.env.py315-django52]
deps = ["Django>=5.2.8,<5.3"]

[tool.tox.env.py312-django60]
deps = ["Django>=6.0,<6.1"]

[tool.tox.env.py313-django60]
deps = ["Django>=6.0,<6.1"]

[tool.tox.env.py314-django60]
deps = ["Django>=6.0,<6.1"]

[tool.tox.env.py315-django60]
deps = ["Django>=6.0,<6.1"]

[tool.tox.env.py312-django61]
deps = ["Django>=6.1,<6.2"]

[tool.tox.env.py313-django61]
deps = ["Django>=6.1,<6.2"]

[tool.tox.env.py314-django61]
deps = ["Django>=6.1,<6.2"]

[tool.tox.env.py315-django61]
deps = ["Django>=6.1,<6.2"]

[tool.tox.env.py314-djangomain]
description = "Run tests against Django's development branch"
deps = ["Django @ git+https://github.com/django/django.git@main"]

[tool.tox.env.format]
allowlist_externals = ["ruff"]
commands = [
    ["ruff", "format", "django_urlconfchecks", "tests"],
    ["ruff", "check", "--select", "I", "--fix", "django_urlconfchecks", "tests"],
]

[tool.tox.env.lint]
allowlist_externals = ["ruff", "ty"]
commands = [
    ["ruff", "check", "django_urlconfchecks", "tests"],
    ["ty", "check", "django_urlconfchecks", "tests"],
]

[tool.tox.env.build]
allowlist_externals = ["uv", "zensical", "twine"]
extras = ["doc", "dev"]
commands = [
    ["uv", "build"],
    ["zensical", "build", "--strict"],
    ["twine", "check", "dist/*"],
]
